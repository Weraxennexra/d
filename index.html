<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>çok uzakta</title>
<style>
  :root {
    --bg: #000;
    --card: #0c0c0d;
    --border: #202022;
    --text: #fff;
    --muted: #6b6b70;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 20px;
  }
  main { width: 100%; max-width: 560px; text-align: center; }
  h1 { margin: 0; font-size: clamp(2.6rem, 9vw, 3.6rem); font-weight: 700; letter-spacing: -0.01em; }
  .name {
    margin: 36px 0 0; font-size: 1.7rem; font-weight: 300;
    background: linear-gradient(90deg, #5eead4, #38bdf8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  hr { border: 0; height: 1px; background: #1c1c1e; margin: 56px auto; }
  hr.short { width: 100px; }
  .links { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
  .links a {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 0 28px; height: 62px;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    font-weight: 600; font-size: 1.05rem; text-decoration: none;
    transition: border-color .2s, background .2s;
  }
  .links a:hover, .links a:focus-visible { background: #131315; border-color: currentColor; outline: none; }
  .links svg { width: 22px; height: 22px; fill: currentColor; }
  .dc { color: #5865f2; } .dc.red { color: #ef4444; }
  footer { margin-top: 0; font-size: .85rem; font-style: italic; color: var(--muted); }
  hr.wide { max-width: 500px; margin: 36px auto 40px; background: #151517; }
</style>
</head>
